services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: catraca_test
      POSTGRES_PASSWORD: catraca_test
      POSTGRES_DB: catraca_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catraca_test -d catraca_test"]
      interval: 1s
      timeout: 3s
      retries: 25

  gates:
    build:
      context: .
      target: gates
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: test
      DATABASE_URL: postgres://catraca_test:catraca_test@db:5432/catraca_test
      AUTH_SECRET: catraca-test-secret
      PARTNER_API_KEY: catraca-partner-secret-key
      GATEWAY_DELAY_MULTIPLIER: ${GATEWAY_DELAY_MULTIPLIER:-0.05}
